<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Add a song · SpotiFrax</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="add-page">
    <header class="add-header">
      <div class="brand"><span class="dot"></span> SpotiFrax</div>
    </header>

    <h1 style="margin:0 0 4px;font-size:24px;">Add a song to the queue</h1>
    <p style="color:var(--muted);margin:0 0 20px;">Search Spotify and tap add.</p>

    <div class="search-row">
      <input id="q" type="search" placeholder="Search songs or artists…"
             autocomplete="off" autocapitalize="off" autocorrect="off" />
    </div>

    <div id="spinner" class="spinner" hidden></div>
    <ul id="results" class="results"></ul>
    <p id="hint" class="hint">Start typing to find a song.</p>

    <section id="queue-section" class="queue-section">
      <h2 class="queue-heading">Up next · vote to reorder</h2>
      <ul id="vote-list" class="results"></ul>
      <p id="queue-empty" class="hint">No songs yet. Add one above.</p>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/add.js"></script>
</body>
</html>
